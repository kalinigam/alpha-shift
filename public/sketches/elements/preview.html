<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alpha Shift — hero elements (SVG)</title>
<style>
  body{margin:0;background:#F7F5F0;color:#141311;font-family:"Geist",system-ui,sans-serif;padding:40px}
  h1{font-weight:600;letter-spacing:-.03em;font-size:1.4rem;margin:0 0 4px}
  p{color:#6F6A60;margin:0 0 32px;font-size:.9rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
  .cell{background:#fff;border:1px solid rgba(20,19,17,.12);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .cell .box{min-height:180px;display:flex;align-items:center;justify-content:center}
  .cell img{max-width:100%;max-height:220px}
  .cell .name{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6F6A60}
</style>
</head>
<body>
  <h1>Hero elements — individual SVGs</h1>
  <p>Recreated from hero.png · soft graphite + pencil filter · each file in /public/sketches/elements/</p>
  <div class="grid">
    <div class="cell"><div class="box"><img src="spool.svg" alt="spool" /></div><span class="name">spool.svg</span></div>
    <div class="cell"><div class="box"><img src="tangle-balls.svg" alt="tangle balls" /></div><span class="name">tangle-balls.svg</span></div>
    <div class="cell"><div class="box"><img src="brain.svg" alt="brain" /></div><span class="name">brain.svg</span></div>
    <div class="cell"><div class="box"><img src="thread.svg" alt="thread" /></div><span class="name">thread.svg</span></div>
    <div class="cell"><div class="box"><img src="clusters.svg" alt="clusters" /></div><span class="name">clusters.svg</span></div>
    <div class="cell"><div class="box"><img src="ball.svg" alt="ball" /></div><span class="name">ball.svg</span></div>
  </div>
</body>
</html>
